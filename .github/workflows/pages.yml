name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/uk-life-exam-questions-azpue3]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Guard: the site is generated from data/src, so fail loudly if the
      # committed CSV does not match its sources or fails validation.
      - name: Verify question bank
        run: |
          python3 data/src/build.py
          git diff --exit-code -- data/questions.csv

      # enablement: true turns Pages on for the repo if it is not already.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
